<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Stonehenge — a studio table of products. Click an object to enter."
    />
    <meta name="theme-color" content="#12140f" />
    <link rel="canonical" href="https://menhir-holdings.vercel.app/" />
    <title>Stonehenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div id="reticle" class="reticle" aria-hidden="true"></div>
    <div class="veil" id="veil" aria-hidden="true"></div>

    <header class="mast">
      <p class="mast__brand">Stonehenge</p>
    </header>

    <aside class="hud" id="hud" aria-live="polite">
      <p class="hud__index" id="hud-index"></p>
      <h1 class="hud__name" id="hud-name"></h1>
      <p class="hud__tag" id="hud-tag"></p>
      <button class="hud__enter" id="hud-enter" type="button">Enter</button>
    </aside>

    <nav class="sr-only" aria-label="Project links">
      <ul id="a11y-list"></ul>
    </nav>

    <footer class="rail" id="rail">
      <span id="hud-hint">click an object · enter</span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
